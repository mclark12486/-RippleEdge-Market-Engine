name: Omega incremental municipal permit ingestion
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    paths:
      - 'omega_incremental_permits.py'
      - 'test_omega_incremental_permits.py'
      - '.github/workflows/omega-incremental-permits.yml'
permissions:
  contents: write
concurrency:
  group: omega-incremental-permits
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_omega_incremental_permits.py test_omega_permit_source_census.py test_omega_permit_coverage_comparison.py
      - name: Refresh state before scanning
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Audit provider total row counts
        run: python omega_permit_source_census.py
      - name: Inspect source update fields
        run: python omega_permit_schema_inspection.py
      - name: Read recent municipal permit pages and match company directory
        run: python omega_incremental_permits.py --limit 25
      - name: Compare ingested coverage against provider totals
        run: python omega_permit_coverage_comparison.py
      - name: Persist receipt with conflict retry
        run: |
          git config user.name "omega-incremental-bot"
          git config user.email "omega-incremental-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add state/omega_incremental_permits.json state/omega_permit_source_counts.json state/omega_permit_schema_inspection.json state/omega_permit_coverage_comparison.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Omega incremental permits receipt [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            python omega_permit_source_census.py
            python omega_permit_schema_inspection.py
            python omega_incremental_permits.py --limit 25
            python omega_permit_coverage_comparison.py
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omega-incremental-permits-${{ github.run_id }}
          path: |
            state/omega_incremental_permits.json
            state/omega_permit_source_counts.json
            state/omega_permit_schema_inspection.json
            state/omega_permit_coverage_comparison.json
          retention-days: 30
