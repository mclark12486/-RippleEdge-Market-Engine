name: Omega performance audit verification
on:
  workflow_dispatch:
  push:
    paths:
      - 'omega_performance_audit.py'
      - 'test_omega_performance_audit.py'
      - '.github/workflows/omega-performance-audit.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_omega_performance_audit.py test_omega_paper_engine.py
