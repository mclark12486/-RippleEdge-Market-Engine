name: Omega rotating geographic intelligence census
on:
  workflow_dispatch:
  schedule:
    - cron: '11,41 * * * *'
  push:
    paths:
      - 'omega_geographic_census.py'
      - 'test_omega_geographic_census.py'
      - '.github/workflows/omega-geographic-census.yml'
permissions:
  contents: write
concurrency:
  group: omega-geographic-census
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_omega_geographic_census.py test_omega_geographic_records.py test_omega_market_directory.py
      - name: Synchronize current research cursor
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Refresh SEC company directory
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ ! -s state/omega_sec_company_directory.csv ] || [ "$(python -c 'import json,pathlib; p=pathlib.Path("state/omega_sec_company_directory_receipt.json"); print(json.loads(p.read_text()).get("retrieved_at", "")[:10] if p.exists() else "")')" != "$(date -u +%F)" ]; then
            python omega_market_directory.py
          fi
      - run: python omega_geographic_census.py --batch-size 12
      - name: Persist geographic coverage and research receipts
        run: |
          git config user.name "omega-geographic-bot"
          git config user.email "omega-geographic-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add state/omega_geographic_census.json state/omega_sec_company_directory.csv state/omega_sec_company_directory_receipt.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Omega geographic census receipt [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            python omega_geographic_census.py --batch-size 12
          done
          echo "Failed to persist geographic census after three conflict retries"
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omega-geographic-census-${{ github.run_id }}
          path: |
            state/omega_geographic_census.json
            state/omega_sec_company_directory_receipt.json
          retention-days: 30
