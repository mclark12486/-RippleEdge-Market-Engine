name: Omega independent shadow daily checkpoint
on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 1-5'
  push:
    paths:
      - 'omega_independent_checkpoint.py'
      - 'test_omega_independent_checkpoint.py'
      - '.github/workflows/omega-independent-daily.yml'
permissions:
  contents: write
concurrency:
  group: omega-independent-paper-state
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify isolated paper accounting
        run: python -m unittest -v test_omega_independent_checkpoint.py test_omega_paper_engine.py test_omega_performance_audit.py
      - run: python -m pip install 'yfinance>=0.2.65,<2'
      - name: Run market checkpoint
        run: python omega_independent_checkpoint.py
      - name: Preserve separate paper state
        run: |
          git config user.name "omega-shadow-bot"
          git config user.email "omega-shadow-bot@users.noreply.github.com"
          git add state/omega_independent_paper_state.json state/omega_independent_paper_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Omega isolated daily shadow receipt [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omega-independent-shadow-${{ github.run_id }}
          path: |
            state/omega_independent_paper_state.json
            state/omega_independent_paper_latest.json
          retention-days: 90
