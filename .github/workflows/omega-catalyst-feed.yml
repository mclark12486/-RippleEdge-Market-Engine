name: Omega cross-market catalyst event router
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    paths:
      - 'omega_catalyst_feed.py'
      - 'omega_catalyst_registry.py'
      - 'test_omega_catalyst_feed.py'
      - '.github/workflows/omega-catalyst-feed.yml'
permissions:
  contents: write
concurrency:
  group: omega-catalyst-feed
  cancel-in-progress: false
jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_omega_catalyst_feed.py
      - name: Sync state
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Route market-wide SEC filing candidates
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python omega_catalyst_feed.py
      - name: Persist event checkpoint
        run: |
          git config user.name "omega-catalyst-bot"
          git config user.email "omega-catalyst-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add state/omega_catalyst_feed.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Omega catalyst event checkpoint [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            SEC_USER_AGENT="${{ secrets.SEC_USER_AGENT }}" python omega_catalyst_feed.py
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omega-catalyst-feed-${{ github.run_id }}
          path: state/omega_catalyst_feed.json
          retention-days: 30
