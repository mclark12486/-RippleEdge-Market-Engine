name: RippleEdge forensic shadow intake
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_shadow.py'
      - 'research_models.py'
      - 'test_research_models.py'
      - 'forensic_shadow.py'
      - '.github/workflows/forensic-shadow.yml'
  schedule:
    - cron: '27 * * * *'
permissions:
  contents: write
concurrency:
  group: rippleedge-state-writer
  cancel-in-progress: false
jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test shadow analytical primitives
        run: python -m unittest -v test_research_models.py
      - name: Validate upstream census and run bounded primary-source research
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FORENSIC_BATCH_SIZE: '8'
        run: python forensic_shadow.py
      - name: Analyze multi-year SEC cash flow (shadow only)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ANALYSIS_BATCH_SIZE: '150'
        run: python analyze_shadow.py
      - name: Persist shadow state and immutable receipts
        run: |
          set -e
          git config user.name rippleedge-bot
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/forensic_shadow.sqlite state/forensic_shadow_initialized state/forensic_shadow_receipt_*.json state/analysis_receipt_*.json
          git commit -m "RippleEdge shadow forensic intake $(date -u +%Y%m%dT%H%M%SZ)"
          # Never rebase a modified SQLite binary against a concurrent writer.
          # Fail safely and retain the uploaded artifact rather than corrupt state.
          git fetch origin main
          base=$(git rev-parse HEAD^)
          if [ "$base" != "$(git rev-parse origin/main)" ]; then
            if git diff --name-only "$base" origin/main -- state/forensic_shadow.sqlite state/forensic_shadow_initialized | grep -q .; then
              echo "::error::Concurrent forensic database writer; preserve artifact for recovery."
              exit 1
            fi
            # Only code/other state changed upstream. Reapply generated forensic
            # state onto current HEAD without merging binary databases.
            generated_commit=$(git rev-parse HEAD)
            git reset --hard origin/main
            git restore --source="$generated_commit" --staged --worktree -- state/forensic_shadow.sqlite state/forensic_shadow_initialized
            git diff-tree --no-commit-id --name-only -r "$generated_commit" -- state/forensic_shadow_receipt_ state/analysis_receipt_ > /tmp/rippleedge-generated-paths
            while IFS= read -r generated_path; do
              [ -z "$generated_path" ] || git restore --source="$generated_commit" --staged --worktree -- "$generated_path"
            done < /tmp/rippleedge-generated-paths
            git commit -m "RippleEdge shadow forensic intake (state-only)"
          fi
          git push origin HEAD:main
      - name: Upload shadow research receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rippleedge-forensic-shadow-${{ github.run_id }}
          path: |
            state/forensic_shadow.sqlite
            state/forensic_shadow_initialized
            state/forensic_shadow_receipt_*.json
            state/analysis_receipt_*.json
          retention-days: 90
