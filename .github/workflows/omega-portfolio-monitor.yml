name: Omega portfolio monitoring verification
on:
  workflow_dispatch:
  push:
    paths:
      - 'omega_portfolio_monitor.py'
      - 'test_omega_portfolio_monitor.py'
      - 'omega_risk_simulation.py'
      - 'test_omega_risk_simulation.py'
      - '.github/workflows/omega-portfolio-monitor.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_omega_portfolio_monitor.py test_omega_risk_simulation.py test_omega_drawdown_triage.py
