name: RippleEdge market-wide census and SEC index
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'marketwide.py'
      - 'price_scan.py'
      - 'breadth_scan.py'
      - 'forecast_loop.py'
      - 'forecast_ledger.py'
      - 'test_forecast_loop.py'
      - 'history_backfill.py'
      - '.github/workflows/marketwide.yml'
permissions:
  contents: write
concurrency:
  group: rippleedge-state-writer
  cancel-in-progress: false
jobs:
  marketwide:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run market-wide census and SEC index
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python marketwide.py
      - name: Bulk daily prices and volume (licensed provider if configured)
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python price_scan.py
      - name: Incrementally backfill bulk market history
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python history_backfill.py
      - name: Screen all available market-wide daily bars
        run: python breadth_scan.py
      - name: Verify prospective forecast loop tests
        run: python -m unittest -v test_research_models.py test_forecast_ledger.py test_forecast_loop.py
      - name: Freeze and score prospective shadow forecasts
        run: python forecast_loop.py
      - name: Persist small database and immutable receipt
        run: |
          set -e
          git config user.name rippleedge-bot
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/marketwide.sqlite state/marketwide_initialized state/marketwide_receipt_*.json state/price_receipt_*.json state/breadth_receipt_*.json state/history_receipt_*.json state/forecast_receipt_*.json
          git commit -m "RippleEdge marketwide census $(date -u +%Y%m%dT%H%M%SZ)"
          git fetch origin main
          base=$(git rev-parse HEAD^)
          if [ "$base" != "$(git rev-parse origin/main)" ]; then
            if git diff --name-only "$base" origin/main -- state/marketwide.sqlite state/marketwide_initialized | grep -q .; then
              echo "::error::Concurrent marketwide database writer; preserve artifact for recovery."
              exit 1
            fi
            generated_commit=$(git rev-parse HEAD)
            git reset --hard origin/main
            git restore --source="$generated_commit" --staged --worktree -- state/marketwide.sqlite state/marketwide_initialized
            git diff-tree --no-commit-id --name-only -r "$generated_commit" -- state/marketwide_receipt_ state/price_receipt_ state/breadth_receipt_ state/history_receipt_ state/forecast_receipt_ > /tmp/rippleedge-generated-paths
            while IFS= read -r generated_path; do
              [ -z "$generated_path" ] || git restore --source="$generated_commit" --staged --worktree -- "$generated_path"
            done < /tmp/rippleedge-generated-paths
            git commit -m "RippleEdge marketwide census (state-only)"
          fi
          git push origin HEAD:main
      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rippleedge-marketwide-${{ github.run_id }}
          path: |
            state/marketwide.sqlite
            state/marketwide_receipt_*.json
            state/price_receipt_*.json
            state/breadth_receipt_*.json
            state/history_receipt_*.json
            state/forecast_receipt_*.json
          retention-days: 90
