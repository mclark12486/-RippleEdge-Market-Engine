name: RippleEdge market-wide census and SEC index
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'marketwide.py'
      - 'price_scan.py'
      - 'breadth_scan.py'
      - 'history_backfill.py'
      - '.github/workflows/marketwide.yml'
permissions:
  contents: write
concurrency:
  group: rippleedge-state-writer
  cancel-in-progress: false
jobs:
  marketwide:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run market-wide census and SEC index
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python marketwide.py
      - name: Bulk daily prices and volume (licensed provider if configured)
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python price_scan.py
      - name: Incrementally backfill bulk market history
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python history_backfill.py
      - name: Screen all available market-wide daily bars
        run: python breadth_scan.py
      - name: Persist small database and immutable receipt
        run: |
          set -e
          git config user.name rippleedge-bot
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/marketwide.sqlite state/marketwide_initialized state/marketwide_receipt_*.json state/price_receipt_*.json state/breadth_receipt_*.json state/history_receipt_*.json
          git commit -m "RippleEdge marketwide census $(date -u +%Y%m%dT%H%M%SZ)"
          git fetch origin main
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::Concurrent state update detected; retaining workflow artifact, no binary rebase."
            exit 1
          fi
          git push origin HEAD:main
      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rippleedge-marketwide-${{ github.run_id }}
          path: |
            state/marketwide.sqlite
            state/marketwide_receipt_*.json
            state/price_receipt_*.json
            state/breadth_receipt_*.json
            state/history_receipt_*.json
          retention-days: 90
