name: Omega historical importer verification
on:
  workflow_dispatch:
  push:
    paths:
      - 'omega_historical_import.py'
      - 'test_omega_historical_import.py'
      - 'omega_sharadar_adapter.py'
      - 'test_omega_sharadar_adapter.py'
      - '.github/workflows/omega-historical-import-test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test historical ingestion integrity
        run: python -m unittest -v test_omega_historical_import.py test_omega_sharadar_adapter.py test_omega_data_audit.py test_omega_walkforward.py
